<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 42 42">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.22"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4ED"/>
      <stop offset="1" stop-color="#F2EEE5"/>
    </linearGradient>
  </defs>

  <!-- warm paper -->
  <rect width="42" height="42" fill="url(#paper)"/>

  <!-- subtle hand-painted window shadow -->
  <rect x="6.0" y="6.0" width="30" height="29" rx="0.6"
        fill="#E6DFD2" opacity="0.32" filter="url(#rough)"/>

  <!-- window frame -->
  <rect x="7.2" y="7.2" width="27.6" height="27.0"
        fill="#F5F1E9" stroke="#6D685F" stroke-width="0.55"/>
  <rect x="8.4" y="8.4" width="25.2" height="24.6"
        fill="#D9E0DF" stroke="#817A70" stroke-width="0.35"/>

  <!-- exterior light, kept minimal -->
  <rect x="9.0" y="9.0" width="24.0" height="5.4" fill="#E9E8DF"/>
  <path d="M9 14.5 L33 14.5" stroke="#A5A298" stroke-width="0.28"/>

  <!-- aluminum Venetian blind headrail -->
  <rect x="7.0" y="12.9" width="28.0" height="1.35"
        rx="0.25" fill="#777168" stroke="#5F5A53" stroke-width="0.25"/>

  <!-- front-facing aluminum slats -->
  <g fill="#8A8177" stroke="#625C54" stroke-width="0.18">
    <path d="M7.3 14.5 H34.7 L34.35 15.45 H7.65 Z"/>
    <path d="M7.3 15.65 H34.7 L34.35 16.60 H7.65 Z"/>
    <path d="M7.3 16.80 H34.7 L34.35 17.75 H7.65 Z"/>
    <path d="M7.3 17.95 H34.7 L34.35 18.90 H7.65 Z"/>
    <path d="M7.3 19.10 H34.7 L34.35 20.05 H7.65 Z"/>
    <path d="M7.3 20.25 H34.7 L34.35 21.20 H7.65 Z"/>
    <path d="M7.3 21.40 H34.7 L34.35 22.35 H7.65 Z"/>
    <path d="M7.3 22.55 H34.7 L34.35 23.50 H7.65 Z"/>
    <path d="M7.3 23.70 H34.7 L34.35 24.65 H7.65 Z"/>
    <path d="M7.3 24.85 H34.7 L34.35 25.80 H7.65 Z"/>
    <path d="M7.3 26.00 H34.7 L34.35 26.95 H7.65 Z"/>
    <path d="M7.3 27.15 H34.7 L34.35 28.10 H7.65 Z"/>
    <path d="M7.3 28.30 H34.7 L34.35 29.25 H7.65 Z"/>
    <path d="M7.3 29.45 H34.7 L34.35 30.40 H7.65 Z"/>
  </g>

  <!-- bottom rail -->
  <rect x="7.1" y="30.45" width="27.8" height="1.25"
        rx="0.25" fill="#706960" stroke="#57524B" stroke-width="0.25"/>

  <!-- lift cords -->
  <g stroke="#6A655D" stroke-width="0.32" fill="none">
    <path d="M11.2 13.5 V31.4"/>
    <path d="M30.8 13.5 V31.4"/>
  </g>

  <!-- right-side control cord -->
  <path d="M35.25 14.0 V29.2 C35.25 31.0 34.35 32.0 34.35 33.1
           C34.35 34.0 35.0 34.55 35.55 34.1 C36.0 33.7 35.7 33.05 35.25 32.75"
        fill="none" stroke="#655F57" stroke-width="0.34"/>

  <!-- tiny organic highlight -->
  <path d="M8.0 31.9 Q21 32.7 34.0 31.9" fill="none"
        stroke="#B8AEA0" stroke-width="0.3" opacity="0.8"/>

  <!-- handmade title -->
  <text x="21" y="38.0" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="2.45" letter-spacing="0.35"
        fill="#625D55">ALUMINUM BLINDS</text>
</svg>